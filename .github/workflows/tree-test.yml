name: Tree feature test

on:
  push:
    paths:
      - 'game.js'
      - 'tree.test.js'
      - '.github/workflows/tree-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tree.test.js
