<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sandbox Game — Prototype V1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="game" width="960" height="540" aria-label="Sandbox Game"></canvas>
    <section class="hud" aria-label="Chỉ số người chơi">
      <div class="bars">
        <span>❤️ <b id="health">20</b></span>
        <span>🍖 <b id="hunger">20</b></span>
        <span>💧 <b id="thirst">20</b></span>
        <span>🌡️ <b id="temp">22°C</b></span>
        <span>✨ <b id="xp">0</b></span>
      </div>
      <div class="help">WASD di chuyển · 1-4 chọn block · Space đặt block · X phá block · P tạm dừng</div>
    </section>
    <section id="pause" class="pause hidden">
      <h1>TẠM DỪNG</h1>
      <p>Nhấn <b>P</b> để tiếp tục.</p>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
